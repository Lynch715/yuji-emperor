<!doctype html><meta charset="utf-8"><title>批次五 · 存储验收</title><style>body{font:18px sans-serif;margin:36px;max-width:850px;background:#f6f1e3;color:#22382e}button{min-height:48px;font:inherit;padding:12px}pre{white-space:pre-wrap;line-height:1.6}</style><h1>批次五 · IndexedDB 工程验收</h1><p>仅使用本地独立来源的合成存档。</p><button id="run">运行工程存储验收</button><pre id="result">等待运行</pre><button id="pending">验证合成待续核心恢复</button><pre id="pending-result"></pre><script type="module">
import {createIDB,createSaveStore,pack,unpack} from '../../src/store/save.js';
import {createState,migrate} from '../../src/core/state.js';
import {initialTurn,forecastTurn,commitTurn} from '../../src/core/turn.js';
const button=document.querySelector('#run'),out=document.querySelector('#result'),check=(x,m)=>{if(!x)throw Error(m);};
button.onclick=async()=>{button.disabled=true;try{
 let s=initialTurn(createState({seed:'E1·浏览器升级'}));s.v=7;
 const old=await new Promise((resolve,reject)=>{const r=indexedDB.open('yuji-emperor',2);r.onupgradeneeded=()=>{r.result.createObjectStore('slots');r.result.createObjectStore('archives');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
 await new Promise((resolve,reject)=>{const tx=old.transaction('slots','readwrite');tx.objectStore('slots').put(pack(s),1);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});old.close();
 const primary=createIDB(indexedDB),backup={getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)},store=createSaveStore({primary,backup,validate:migrate});
 s=(await store.load(1)).state;check(s.v===8,'v7迁移');
 for(let i=0;i<40;i++)s=commitTurn(s,forecastTurn(s),{chapter:{朝:'宫门静肃。'.repeat(60),午:'案牍往来。'.repeat(60),夜:'灯下记事。'.repeat(60)}});
 await store.save(1,s);const main=unpack(await primary.get(1)).state,back=unpack(localStorage.getItem('yuji:slot:1')).state;
 check(main.volumes.length===0&&main.volumeIndex.length>0,'主档分卷目录');check((await primary.getVolume(main.volumeIndex[0].key)).chapters.length===18,'独立卷');check(back.history.length===0,'核心副本');
 const again=await store.load(1);check(again.state.volumes[0].chapters.length===18&&!again.readOnly,'分卷载回');
 const stale=createSaveStore({primary,backup,validate:migrate});await stale.load(1);await store.save(1,s);let conflict=false;try{await stale.save(1,s);}catch{conflict=true;}check(conflict,'并发冲突');
 out.textContent=JSON.stringify({passed:true,databaseVersion:3,saveVersion:s.v,turns:s.turn,recentChapters:main.history.length,archivedChapters:again.state.volumes[0].chapters.length,mainBytes:new Blob([JSON.stringify(await primary.get(1))]).size,recoveryBytes:new Blob([localStorage.getItem('yuji:slot:1')]).size,conflictProtected:conflict},null,2);
}catch(e){out.textContent=JSON.stringify({passed:false,error:e.message});}};

document.querySelector('#pending').onclick=async()=>{
 const out=document.querySelector('#pending-result'),primary=createIDB(indexedDB),backup={getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)};
 const original=await primary.get(1),originalBackup=backup.getItem('yuji:slot:1');
 try{
  const store=createSaveStore({primary,backup,validate:migrate});const loaded=await store.load(1),base=loaded.state,f=forecastTurn(base);await store.save(1,{...base,pending:{forecast:f}});
  await primary.put(1,null);
  const recovery=await createSaveStore({primary,backup,validate:migrate}).load(1);const nf=recovery.state.pending.forecast,n=commitTurn(recovery.state,nf,{});
  check(nf.die===f.die&&n.rng===f.state.rng,'原骰与RNG');check(n.nation.treasury===f.state.nation.treasury,'钱粮结算');
  out.textContent=JSON.stringify({passed:true,originalDie:f.die,recoveredDie:nf.die,treasury:n.nation.treasury,recoveryWarnings:recovery.problems},null,2);
 }catch(e){out.textContent=JSON.stringify({passed:false,error:e.message});}
 finally{await primary.put(1,original);if(originalBackup!==null)backup.setItem('yuji:slot:1',originalBackup);}
};
</script>
