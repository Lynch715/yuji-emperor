name: Test and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Build game
        run: npm run build
      - name: Package public website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets/art ]; then
            find assets/art -type f -name '*.webp' -exec sh -c 'mkdir -p "_site/$(dirname "$1")"; cp "$1" "_site/$1"' _ {} \;
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
