async function advance(local = false) {
  if (!state || readOnly || busy || state.ending) return;
  busy = true;
  let ac = new AbortController();
  try {
    if (!state.pending) {
      const forecast = forecastTurn(state, state.schedule);
      state = {
        ...state,
        pending: { forecast },
        turnBudget: state.turnBudget || createBudget(),
      };
      if (!(await persist()))
        throw new Error("本旬尚未存妥，请先导出存档，再重试。");
    }
    const f = state.pending.forecast,
      requestBudget = budget();
    render();
    let narrative;
    if (state.settings.demo || local) narrative = mockNarrative(f);
    else {
      narrative = await callJSON(config, turnMessages(state, f), {
        budget: budget(),
        signal: ac.signal,
        onMetric: markMetric,
        validate: (d) => validateTurn(d, f),
        onPartial: (raw) => {
          const el = $("#stream");
          if (el)
            el.textContent =
              "正文草稿 · 正在续写\n\n" + extractPartialChapter(raw);
        },
      });
    }
    state = commitTurn(state, f, narrative);
    if (state.ending && !state.settings.demo) {
      try {
        const record = state.chronicles.find((r) => r.id === reignId(state)),
          bio = await callJSON(config, biographyMessages(state, record), {
            budget: requestBudget,
            onMetric: markMetric,
            validate: (d) => {
              if (typeof d.biography !== "string" || d.biography.length < 500)
                throw new Error("本纪字数不足");
              return d;
            },
          });
        state = applyBiography(state, bio);
      } catch {
        toast("本朝已封卷，本纪可在史馆查阅。");
      }
    }
    state.turnBudget = null;
    await persist();
  } catch (e) {
    toast(e.message);
    if (state) await persist();
  } finally {
    busy = false;
    render();
  }
}

      await saveQueue.catch(() => {});
      const l = await store.load(Number(b.dataset.load));
      if (!l.state) throw new Error("此卷没有可读进度");
      state = l.state;
      slot = Number(b.dataset.load);
      try {
        localStorage.setItem("yuji:active-slot", String(slot));
      } catch {}
      readOnly = l.readOnly;
      saveStatus = l.problems.join("；");
      closeDialog();
      render();
    } else if (b.dataset.exportSlot) {
      const l = await store.load(Number(b.dataset.exportSlot));
      if (l.state)
        download(
          "御极-第" + b.dataset.exportSlot + "卷.json",
          store.exportJSON(l.state),
        );
    } else if (b.dataset.archiveExport) {
      const a = (await store.listArchives()).find(
        (a) => a.id === b.dataset.archiveExport,
      );
      if (a) download("御极-封存旧卷-" + a.turn + "旬.json", a.data);
    } else if (b.dataset.raw) {
      const l = await store.load(Number(b.dataset.raw));
      download(
        "御极-原始副本-" + b.dataset.raw + ".json",
        JSON.stringify(l.raw, null, 2),
      );
    } else if (b.dataset.copySlot) {
      if (!state) throw new Error("尚无进度");
      const target = Number(b.dataset.copySlot),
        l = await store.load(target);
      if (l.state || l.readOnly) throw new Error("此卷已非空白");
      await store.save(target, state);
      slot = target;
      readOnly = false;
      toast("已另存于第 " + slot + " 卷");
      await showSaves();
    } else if (b.dataset.importSlot) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json,application/json";
      input.onchange = async () => {
        try {
          const file = input.files[0];
          if (!file) return;
          if (file.size > 30000000) throw new Error("文件超过 30 MB");
          await store.importJSON(
            Number(b.dataset.importSlot),
            await file.text(),
          );
          toast("导入完成，可读此卷");
          await showSaves();
        } catch (err) {
          toast(err.message);
        }
      };
      input.click();
    }
  } catch (error) {
    toast(error.message);
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "oral-form") {
    e.preventDefault();
    oral($("#oral").value.trim()).catch((err) => toast(err.message));
  }
});
document.addEventListener("dragstart", (e) => {
  const b = e.target.closest("[data-action]");
  if (b) e.dataTransfer.setData("text/plain", b.dataset.action);
});
document.addEventListener("dragover", (e) => {
  if (e.target.closest("[data-slot]")) e.preventDefault();
});
document.addEventListener("drop", (e) => {
  const target = e.target.closest("[data-slot]");
  if (!target) return;
  e.preventDefault();
  try {
    preferred = target.dataset.slot;
    chooseAction(e.dataTransfer.getData("text/plain"));
  } catch (err) {
    toast(err.message);
  }
});
async function boot() {
  let remembered = 1;
  try {
    remembered = Number(localStorage.getItem("yuji:active-slot")) || 1;
  } catch {}
  slot = [1, 2, 3].includes(remembered) ? remembered : 1;
  const first = await store.load(slot);
  if (first.state) {
    state = first.state;
    readOnly = first.readOnly;
    saveStatus = first.problems.join("；");
  }
  render();
}
boot().catch((error) => {
  toast(error.message);
  render();
});

return {};
},

"src/ui/common.js":function(__load){
const { initMobileViewport } = __load("src/ui/mobile.js");
const $ = (selector) => document.querySelector(selector);
function esc(text) {
  return String(text ?? "").replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
}
let toastTimer;
function toast(text) {
  $("#notice").textContent = text;
  $("#notice").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#notice").classList.remove("show"), 6000);
}
let returnFocus, returnSelector;
function openDialog(title, body, className = "") {
  const d = $("#modal");
  const active=document.activeElement;
  if (d.open) d.close();
  if (!active?.closest?.('#modal')) {
    returnFocus=active;returnSelector=null;
    for (const key of ['command','action','slot','panel']) if(active?.dataset?.[key]) returnSelector='[data-'+key+'="'+CSS.escape(active.dataset[key])+'"]';
  }
  d.onkeydown=null;
  if (className === 'action-shell') body='<div class="dual-content"><article id="action-document" class="paper action-document"><h3>'+esc(title)+'</h3><p>御案上的事，请逐项裁定。</p></article><section class="action-options">'+body+'</section></div>';
  d.className = className;
  d.innerHTML =
    '<div class="dialog-head"><h2 id="modal-title">' +
    esc(title) +
    '</h2><button type="button" id="close-modal" aria-label="关闭窗口">×</button></div>' +
    body;
  $("#close-modal").onclick = () => d.close();
  d.showModal();
  document.documentElement.classList.add("modal-open");
  d.scrollTop = 0;
}
function closeDialog() {
  $("#modal").close();
}
function download(name, data, type = "application/json") {
  const url = URL.createObjectURL(new Blob([data], { type })),
    a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function fitBrandDate() {
  for(const date of document.querySelectorAll('.brand .date')) {
    date.style.removeProperty('font-size');
    const css=getComputedStyle(date),minimum=Number.parseFloat(css.getPropertyValue('--font-minor'))||10;
    let size=Number.parseFloat(css.fontSize);
    while(date.scrollWidth>date.clientWidth&&size>minimum){size=Math.max(minimum,size-.5);date.style.fontSize=size+'px';}
  }
}
function initCommon() {
  initMobileViewport();
  // Refit after rendering, viewport changes and the optional web fonts settle.
  new MutationObserver(fitBrandDate).observe($('#app'),{childList:true});
  window.addEventListener('resize',fitBrandDate);
  document.fonts?.ready.then(fitBrandDate);
  $("#modal").addEventListener("keydown", e => {
    if(e.key!=='Tab')return;
    const d=$("#modal"),items=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,[tabindex="0"]')].filter(x=>x.tabIndex>=0&&x.getClientRects().length&&(!x.checkVisibility||x.checkVisibility()));
    if(!items.length){e.preventDefault();return;}
    const at=items.indexOf(document.activeElement);
    if((e.shiftKey&&at<=0)||(!e.shiftKey&&(at===items.length-1||at<0))){e.preventDefault();items[e.shiftKey?items.length-1:0].focus();}
  });
  $("#modal").addEventListener("close", () => {
    if($("#modal").open)return;
    document.documentElement.classList.remove("modal-open");
    if (returnFocus?.isConnected) returnFocus.focus();
    else if(returnSelector) document.querySelector(returnSelector)?.focus();
  });
}

return {$,esc,toast,openDialog,closeDialog,download,initCommon};
},
"src/ui/mobile.js":function(__load){
// Keep the game at its intended scale while preserving ordinary scrolling and text selection.
function blockPinch(event) {
  if ((event.touches?.length || 0) > 1 || ['gesturestart','gesturechange'].includes(event.type)) {
    if (event.cancelable) event.preventDefault();
  }
}
let installed=false;
function initMobileViewport() {
  if(installed)return;
  installed=true;
  for(const type of ['touchstart','touchmove','gesturestart','gesturechange'])
    document.addEventListener(type,blockPinch,{passive:false});
  const update=()=>{
    const viewport=window.visualViewport;
    document.documentElement.style.setProperty('--app-height',(viewport?.height||window.innerHeight)+'px');
    document.documentElement.style.setProperty('--viewport-top',(viewport?.offsetTop||0)+'px');
  };
  window.addEventListener('resize',update);
  window.visualViewport?.addEventListener('resize',update);
  window.visualViewport?.addEventListener('scroll',update);
  update();
}

return {blockPinch,initMobileViewport};
},

    ["foreign", 4],
    ["provinces", 10],
  ])
    if (
      !Array.isArray(data[key]) ||
      data[key].length < min ||
      data[key].some((x) => !cleanText(x?.name, 20))

    return {
      reply: result.reply,
      innerThought: result.innerThought || "",
      effects: null,
    };

    : reply;

    reply: safe,

  };

function extractPartialChapter(raw) {
  const sections = [];
  for (const key of ["朝", "午", "夜"]) {
    const match = new RegExp('"' + key + '"\\s*:\\s*"').exec(raw);
    if (!match) continue;
    let value = "";
    for (
      let i = match.index + match[0].length;
      i < raw.length && value.length < 3500;
      i++
    ) {
      const c = raw[i];
      if (c === '"') break;
      if (c === "\\") {
        const n = raw[++i];
        if (n === undefined) break;
        if (n === "u") {
          const hex = raw.slice(i + 1, i + 5);

    }

  }

      toast(error.message);
    }
  };
}

return {actionDialog};

// Three independent slots. Corruption/conflicts lock the slot; no automatic repair writes.
function checksum(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++)
    h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return (h >>> 0).toString(16).padStart(8, "0");
}
function pack(state, revision = 1, previous = null) {
  const payload = JSON.stringify(state);

    format: "YUJI1",
    revision,
    previous,
    checksum: checksum(payload),
    payload,
  };
}

    !value ||
    value.format !== "YUJI1" ||
    !Number.isSafeInteger(value.revision) ||
    value.revision < 1 ||
    typeof value.payload !== "string" ||
    value.checksum !== checksum(value.payload)
  )
    throw new Error("存档校验失败");
  const state = JSON.parse(value.payload);
  if (
    !state ||
    typeof state !== "object" ||
    Array.isArray(state) ||
    !Number.isInteger(state.v) ||
    typeof state.runId !== "string" ||
    !Number.isInteger(state.turn) ||
    state.turn < 0
  )
    throw new Error("存档结构无效");
  return { envelope: value, state };
}
function createIDB(indexedDB, timeout = 4000) {

      let settled = false;
      const timer = setTimeout(
        () => finish(new Error("数据库打开超时")),
        timeout,
      );
      const finish = (err, db) => {
        if (settled) {
          db?.close();
          return;
        }
        settled = true;
        clearTimeout(timer);
        err ? reject(err) : resolve(db);
      };
      let rq;
      try {
        rq = indexedDB.open("yuji-emperor", 2);
      } catch (e) {
        finish(e);
        return;
      }
      rq.onupgradeneeded = () => {
        if (settled) {
          rq.transaction.abort();
          return;
        }
        if (!rq.result.objectStoreNames.contains("slots"))
          rq.result.createObjectStore("slots");
        if (!rq.result.objectStoreNames.contains("archives"))
          rq.result.createObjectStore("archives");
      };
      rq.onsuccess = () => finish(null, rq.result);
      rq.onerror = () => finish(rq.error);
      rq.onblocked = () => finish(new Error("数据库被其他页面占用"));
    });
  }
  async function transaction(mode, action, storeName = "slots") {
    const db = await open();
    return new Promise((resolve, reject) => {
      let tx,
        rq,
        settled = false;
      const timer = setTimeout(() => {
        try {
          tx?.abort();
        } catch {}
        finish(new Error("存档读写超时"));
      }, timeout);
      const finish = (error) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        db.close();
        error ? reject(error) : resolve(rq?.result ?? null);
      };
      try {
        tx = db.transaction(storeName, mode);
        tx.oncomplete = () => finish();
        tx.onerror = tx.onabort = () =>
          finish(tx.error || new Error("存档事务失败"));

      } catch (e) {
        finish(e);
      }
    });
  }
  return {
    archive: (id, record) =>
      transaction("readwrite", (st) => st.put(record, id), "archives"),
    archives: () => transaction("readonly", (st) => st.getAll(), "archives"),
    get: (slot) => transaction("readonly", (st) => st.get(slot)),
    put: (slot, record) =>
      transaction("readwrite", (st) => st.put(record, slot)),
    comparePut: async (slot, record, expected) => {
      const db = await open();
      return new Promise((resolve, reject) => {
        let ended = false,
          conflict = false;
        const tx = db.transaction("slots", "readwrite"),
          st = tx.objectStore("slots"),
          rq = st.get(slot),
          timer = setTimeout(() => {
            try {
              tx.abort();
            } catch {}
            finish(new Error("存档写入超时"));
          }, timeout);
        const finish = (error) => {
          if (ended) return;
          ended = true;
          clearTimeout(timer);
          db.close();

function createSaveStore({ primary, backup, validate = (x) => x }) {

    if (![1, 2, 3].includes(slot)) throw new Error("存档位须为 1–3");

  };
  async function copies(slot) {
    const bkey = key(slot);

      Promise.resolve().then(() => primary.get(slot)),
      Promise.resolve().then(() => backup.getItem(bkey)),

    );
  }
  const token = (cs) =>
    JSON.stringify(cs.map((c) => (c.error ? "unavailable" : (c.raw ?? null))));

    const cs = await copies(slot),
      valid = [],
      problems = [];
    if (cs.some((c) => c.error)) locked.add(slot);
    cs.forEach((c, i) => {
      if (c.error) {
        problems.push((i ? "恢复副本" : "主档") + "不可用");
        return;
      }
      if (c.raw != null) {
        try {
          const r = unpack(c.raw);
          r.state = validate(r.state);
          valid.push(r);
        } catch {
          problems.push((i ? "恢复副本" : "主档") + "损坏或版本不受支持");
          locked.add(slot);
        }
      }
    });
    valid.sort((a, b) => b.envelope.revision - a.envelope.revision);
    if (
      valid.length === 2 &&
      valid[0].envelope.checksum !== valid[1].envelope.checksum
    ) {
      const [a, b] = valid.map((v) => v.envelope);
      const immediate =
        a.revision === b.revision + 1 && a.previous === b.checksum;
      const tracedBackup =
        a.revision > b.revision &&
        a.backupAnchor === b.checksum &&
        a.backupRevision === b.revision;
      if (!(immediate || tracedBackup)) {
        locked.add(slot);
        problems.push("主档与恢复副本发生冲突");
      }
    }
    known.set(slot, { token: token(cs), envelope: valid[0]?.envelope || null });
    return {
      state: valid[0]?.state || null,
      readOnly: locked.has(slot),
      problems,
      raw: cs.map((c) => c.raw),
    };
  }
  async function save(slot, state) {
    key(slot);
    if (!known.has(slot)) await load(slot);
    if (locked.has(slot))
      throw new Error("此存档位处于只读保护模式，请先导出原始存档并改用空位");
    const previous = known.get(slot),
      cs = await copies(slot);
    if (token(cs) !== previous.token) {
      locked.add(slot);
      throw new Error("存档已被其他页面修改，已进入只读保护模式");
    }
    validate(state);
    const envelope = pack(
      state,
      (previous.envelope?.revision || 0) + 1,
      previous.envelope?.checksum || null,
    );
    try {
      const savedBackup = unpack(cs[1].raw).envelope;
      envelope.backupAnchor = savedBackup.checksum;
      envelope.backupRevision = savedBackup.revision;
    } catch {}
    let count = 0;
    const warnings = [];
    try {
      if (primary.comparePut)
        await primary.comparePut(slot, envelope, cs[0].raw);
      else await primary.put(slot, envelope);
      count++;
    } catch (e) {
      if (e.code === "CONFLICT") {
        locked.add(slot);
        throw new Error("存档已被其他页面修改，已进入只读保护模式");
      }
      warnings.push("主档写入失败");
    }
    try {
      if (
        backup.getItem(key(slot)) !== cs[1].raw &&
        !(backup.getItem(key(slot)) == null && cs[1].raw == null)
      ) {
        locked.add(slot);
        throw new Error("副本被其他页面修改");
      }
      backup.setItem(key(slot), JSON.stringify(envelope));
      count++;
    } catch {
      warnings.push("恢复副本写入失败");
    }
    if (!count)
      throw new Error("存档未能写入，请立即导出 JSON；原进度仍在内存中");

    return { warnings, revision: envelope.revision };
  }
  async function importJSON(slot, raw) {
    if (raw.length > 30000000) throw new Error("导入文件超过 30 MB");
    const state = validate(unpack(raw).state);

    if (current.readOnly || current.state)
      throw new Error("导入仅允许写入空白且未受保护的存档位");

    return state;
  }
  async function listArchives() {
    let rows = [];
    try {
      rows = (await primary.archives?.()) || [];
    } catch {}
    try {
      const index = JSON.parse(backup.getItem("yuji:archive-index") || "[]");
      for (const id of index) {
        const rec = JSON.parse(backup.getItem("yuji:archive:" + id) || "null");
        if (rec && !rows.some((x) => x.id === rec.id)) rows.push(rec);
      }
    } catch {}
    return rows.sort((a, b) => b.at - a.at);
  }
  async function archiveAndSave(slot, state) {
    const current = await load(slot);
    if (current.readOnly) throw new Error("受保护的存档不能被替换");
    if (!current.state) return save(slot, state);
    const id =
        slot + "-" + Date.now() + "-" + known.get(slot).envelope.checksum,
      record = {
        id,
        slot,
        at: Date.now(),
        name: current.state.emperor.name,
        turn: current.state.turn,
        data: JSON.stringify(pack(current.state)),
        raw: current.raw,
      };
    let retained = 0;
    try {
      if (primary.archive) {
        await primary.archive(id, record);
        retained++;
      }
    } catch {}
    try {
      const index = JSON.parse(backup.getItem("yuji:archive-index") || "[]");
      backup.setItem("yuji:archive:" + id, JSON.stringify(record));
      backup.setItem("yuji:archive-index", JSON.stringify([...index, id]));
      retained++;
    } catch {}
    if (!retained) throw new Error("旧卷未能封存，已停止替换；原档完整保留");
    return save(slot, state);
  }
  return {
    load,
    save,
    importJSON,
    listArchives,
    archiveAndSave,
    exportJSON: (state) => JSON.stringify(pack(validate(state)), null, 2),
  };
}

return {checksum,pack,unpack,createIDB,createSaveStore};
},
"src/core/world.js":function(__load){
const { clone } = __load("src/core/state.js");
function applyWorld(state, data) {
  const s = clone(state),
    text = (v, n = 30) =>
      typeof v === "string"
        ? v.replace(/[<>\u0000-\u001f]/g, "").slice(0, n)
        : "";
  s.dynasty = text(data.dynasty) || s.dynasty;
  s.backstory =
    text(data.backstory, 1200) ||
    "先帝遗命，嗣皇帝即位。百官待诏，天下待新政。";
  const used = new Set();
  for (const [key, items] of [
    ["factions", s.court.factions],
    ["officials", s.court.officials],
    ["consorts", s.harem.consorts],
    ["foreign", s.foreign],
    ["provinces", s.nation.provinces],
  ]) {
    items.forEach((item, i) => {
      const source = data[key]?.[i];
      if (!source) return;
      const name = text(source.name);
      if (name && !used.has(name)) {
        item.name = name;
        used.add(name);
      }
      for (const f of [
        "demand",
        "family",
        "secret",
        "ruler",
        "description",
        "personality",
      ])
        if (source[f]) item[f] = text(source[f], 300);
      if (Array.isArray(item.life) && source.life)
        item.life = [text(source.life, 300)];
    });
  }
  s.dowager = text(data.dowager) || "慈宁太后";
  return s;
}

return {applyWorld};
},
