    <style>
      :root{
--desk:#1c1714;
--desk-deep:#191411;

--cinnabar:#b8322a;

--glyph:#e07a62;
--paper:#efe6d3;
--paper-line:#d6c9af;

"Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC",

--brush:"Ma Shan Zheng", "Kaiti SC", KaiTi, serif;
--font-minor:10px;

--font-note:12px;
--font-small:13px;
--font-ui:14px;
--font-base:16px;
--font-body:17px;

--font-value:20px;

--document-line:36px;
--mobile-line:30px;

--radius-tag:12px;
--radius-pill:22px;

--slot-mobile:56px;
--primary-height:48px;

--bottom-height:64px;

--sidebar-width:340px;
--brand-width:260px;
--glyph-size:28px;
--seal-size:48px;
--seal-mobile:36px;
--pip-size:12px;
--meter-width:72px;
--review-width:420px;
--review-max:1120px;
--dialog-width:760px;
--palace-width:1200px;
--paper-pad:40px;

--intro-width:560px;
--portrait-size:44px;

--drawer-height:85dvh;
--mobile-dialog-height:92dvh;
--picker-height:50dvh;
--picker-width:80vw;
--tracking:0.12em;
--wide-tracking:0.24em;
--indent:2em;
--brush-angle:-4deg;
--shadow:0 var(--s9) var(--s16)
color-mix(in srgb, var(--desk-shade) 45%, var(--clear));
color-scheme:dark;
font-family:var(--sans);
font-size:var(--font-base);
line-height:var(--ui-line);
color:var(--text);
background:var(--desk);
}
*{
box-sizing:border-box;
}
body{
margin:var(--s0);
background:var(--desk);
}
button,
input,
textarea,
select{
font:inherit;
color:inherit;
}
button,
a,
input,
textarea,
select,
summary{
touch-action:manipulation;
}
button{
min-height:var(--target);
min-width:var(--target);
padding:var(--s3) var(--s7);
border:var(--hairline) solid var(--line-strong);
border-radius:var(--radius-button);
background:var(--panel);
color:var(--text-soft);
cursor:pointer;
font-size:var(--font-ui);
}
@media (hover: hover){
button:hover{
background:var(--panel-active);
border-color:var(--gold);
}
}
button:disabled{
cursor:not-allowed;
color:var(--text-muted);
background:var(--clear);
}
button:disabled .glyph{

}
button.primary{
background:var(--cinnabar);
border-color:var(--cinnabar);
color:var(--text-strong);
font-family:var(--serif);

letter-spacing:var(--tracking);
}
@media (hover: hover){
button.primary:hover{
border-color:var(--gold);
}
}
button.quiet{
background:var(--clear);
border-color:var(--clear);
}
button.danger{
color:var(--down);
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible{

outline-offset:var(--focus-line);
}
a{
color:var(--gold);
}
input,
select,
textarea{
width:100%;
min-height:var(--target);
padding:var(--s4) var(--s5);
border:var(--hairline) solid var(--line);
border-radius:var(--radius-button);
background:var(--panel);
color:var(--text);
}
textarea{
resize:vertical;
min-height:var(--top-height);
}
label{
display:block;
margin:var(--s5) var(--s0) var(--s2);
font-size:var(--font-small);
color:var(--text-muted);
}
input[type="checkbox"]{
width:var(--s10);
height:var(--s10);
min-height:var(--s10);
flex:none;
accent-color:var(--gold);
}
label.check{
display:flex;
align-items:center;
gap:var(--s4);
min-height:var(--target);
padding:var(--s2);
margin:var(--s0);
color:var(--text);
}
fieldset{
min-width:var(--s0);
border:var(--hairline) solid var(--line);
padding:var(--s5);
border-radius:var(--radius-card);
margin:var(--s7) var(--s0);
}
legend{
color:var(--gold);
font-size:var(--font-small);
padding:var(--s0) var(--s2);
}
h1,
h2,
h3,
h4,
p{
margin:var(--s0);
}
h1,
h2,
h3,
h4,
strong.serif{
font-family:var(--serif);
}
h2{
font-size:var(--font-document);
font-weight:600;
}
h3{
font-size:var(--font-document);
font-weight:600;
margin-bottom:var(--s3);
}
p + p{
margin-top:var(--s5);
}
small{
font-size:var(--font-note);
}
.muted{
color:var(--text-muted);
}
.positive{
color:var(--up);
}
.negative{
color:var(--down);
}
.hidden{
display:none !important;
}
.skip{
position:fixed;
left:var(--s7);
top:var(--s7);
z-index:20;
background:var(--desk-deep);
padding:var(--s5);
transform:translateY(-200%);
}
.skip:focus{
transform:none;
}
#app{
height:var(--app-height);
display:flex;
flex-direction:column;
min-height:var(--s0);
}
.topbar{
height:var(--top-height);
flex:none;
display:flex;
align-items:center;
gap:var(--s7);
padding:var(--s0) var(--s9);

border-bottom:var(--hairline) solid var(--line);
}
.brand{
width:var(--brand-width);
flex:none;
display:flex;
align-items:center;
gap:var(--s5);
min-width:var(--s0);
}
.brand > div:last-child{

}
.brand h1{

max-width:100%;

}
.seal{
width:var(--seal-size);
height:var(--seal-size);
flex:none;
display:grid;
place-content:center;
text-align:center;
background:var(--cinnabar);
color:var(--text-strong);
border-radius:var(--s1);
font:900 var(--font-ui) / 1.2 var(--serif);
}
.date{
font-size:var(--font-micro);
color:var(--text-muted);

overflow:hidden;
text-overflow:ellipsis;
}
.top-actions{
display:flex;

}
.top-actions button{
padding:var(--s3) var(--s4);
}
.metrics{
display:flex;
gap:var(--s3);
flex:1;
min-width:var(--s0);
}
.metric-group{
background:var(--panel);
border:var(--hairline) solid var(--line);
border-radius:var(--radius-card);
padding:var(--s2) var(--s3);
min-width:var(--s0);
}
.weight-3{
flex:3;
}
.weight-2{
flex:2;
}
.metric-group h2{
font:500 var(--font-micro) / 1.2 var(--sans);
letter-spacing:var(--tracking);
color:var(--gold);
margin-bottom:var(--s1);
}
.metric-values{
display:flex;
gap:var(--s3);
}
.metric{
flex:1;
min-width:var(--s0);
}
.metric-label{
font-size:var(--font-micro);

}
.metric-reading{

align-items:baseline;
gap:var(--s1);
white-space:nowrap;
}
.metric strong{

font-size:var(--font-value);
font-weight:600;
line-height:1.2;
}
.metric small,
.trend{

}
.metric-reading small{
color:var(--text-muted);
}
.metric-meter{
display:block;
width:var(--meter-width);
max-width:100%;
height:var(--meter);
border-radius:var(--s1);
background:var(--line);
margin-top:var(--s1);
overflow:hidden;
}
.metric-meter i{
display:block;
height:100%;
background:var(--gold);
}
.metric.danger strong{
color:var(--down);
}
.metric.danger .metric-meter i{
background:var(--down);
}
.group-danger{
border-color:var(--danger-border);
}
.mobile-menu,
.mobile-stats,
.mobile-energy,
.mobile-nav{
display:none;
}
.workbench{
display:grid;
grid-template-columns:var(--dock-width) minmax(0, 1fr) var(--sidebar-width);
flex:1;
min-height:var(--s0);
}
.dock{
padding:var(--s9);
border-right:var(--hairline) solid var(--line);
overflow:auto;
display:flex;
flex-direction:column;
gap:var(--s8);
}
.action-group h2,
.dock-halls h2{
font:500 var(--font-note) / 1.4 var(--sans);
color:var(--gold);
letter-spacing:var(--wide-tracking);
margin-bottom:var(--s3);
}
.action-grid{
display:grid;
grid-template-columns:repeat(2, minmax(0, 1fr));
gap:var(--s2);
}
.action-card{
height:var(--action-height);
display:flex;
align-items:center;
gap:var(--s2);
padding:var(--s0) var(--s3);
background:var(--panel);
border-color:var(--line);
text-align:left;
min-width:var(--s0);
}
.glyph{
width:var(--glyph-size);
height:var(--glyph-size);
flex:none;
display:grid;
place-items:center;
border-radius:var(--s1);
background:var(--chip);
color:var(--glyph);
font:600 var(--font-ui) / 1 var(--serif);
}
.action-copy{
display:flex;
flex-direction:column;
min-width:var(--s0);
gap:var(--s1);
}
.action-copy strong{
font-size:var(--font-ui);
font-weight:500;
color:var(--text);
}
.action-copy small{

}
.action-card:disabled strong{

}
.dock-halls{
margin-top:auto;

}
.dock-halls > div{
display:grid;
grid-template-columns:repeat(3, minmax(0, 1fr));
gap:var(--s2);
}
.dock-halls button{
padding:var(--s2);
background:var(--clear);
border-color:var(--line);
font-family:var(--serif);
}
.desk{
min-width:var(--s0);

padding:var(--s10) var(--s12) var(--s0);

}
.planning{

min-width:var(--s0);
}
.planning-title{
display:flex;
align-items:center;
justify-content:space-between;
gap:var(--s5);
margin-bottom:var(--s5);
}
.planning-heading{
font:600 var(--font-document) / 1.4 var(--serif);
white-space:nowrap;
color:var(--text-strong);
}
.planning-title{
min-height:var(--target);
padding:var(--s0);
list-style:none;
}
.planning-title::-webkit-details-marker{
display:none;
}
.planning-fold-label{
color:var(--gold);
font-size:var(--font-small);
white-space:nowrap;
}
.planning-overview,
.planning-fold[open] .when-closed,
.planning-fold:not([open]) .when-open,
.planning-fold:not([open]) .planning-heading{
display:none;
}
.planning-fold:not([open]) .planning-title{
margin-bottom:var(--s0);
}
.planning-fold:not([open]) .planning-overview{
display:grid;
grid-template-columns:repeat(3, minmax(0, 1fr));
gap:var(--s3);
flex:1;
min-width:var(--s0);
}
.planning-overview > span{
min-width:var(--s0);
}
.planning-overview small,
.planning-overview strong{
display:block;

text-overflow:ellipsis;
white-space:nowrap;

}
.planning-overview small{
color:var(--text-muted);

}
.planning-overview strong{
color:var(--text-soft);
font-size:var(--font-small);
font-weight:500;
}
.energy{
display:flex;
align-items:center;
gap:var(--s2);
font-size:var(--font-small);
color:var(--text-soft);
white-space:nowrap;
}
.energy-label{
color:var(--text-muted);
}
.pips{
display:flex;
gap:var(--s1);
}
.pip{
width:var(--pip-size);
height:var(--pip-size);
border:var(--hairline) solid var(--gold);
border-radius:50%;
background:var(--gold);
}
.pip.spent{
background:var(--line);
border-color:var(--line-dashed);
}
.pip.over{
background:var(--down);
border-color:var(--down);
}
.schedule{
display:grid;
grid-template-columns:repeat(3, minmax(0, 1fr));
gap:var(--s5);
}
.slot-wrap{
position:relative;
min-width:var(--s0);
}
.slot{
width:100%;
height:var(--slot-height);
display:flex;
flex-direction:column;
align-items:stretch;
gap:var(--s2);
padding:var(--s6);
text-align:left;
background:var(--clear);
border:var(--hairline) dashed var(--line-dashed);
border-radius:var(--radius-card);
overflow:hidden;
}
.filled .slot{
background:var(--panel-active);
border:var(--hairline) solid var(--gold);
}
.slot-meta{
display:flex;
justify-content:space-between;
gap:var(--s1);
font-size:var(--font-note);
color:var(--text-muted);
}
.filled .slot-meta{
color:var(--gold);
}
.slot strong{
font:600 var(--font-value) / 1.5 var(--serif);
color:var(--text-soft);
white-space:nowrap;
}
.filled .slot strong{
color:var(--text-strong);
}
.slot small{
font-size:var(--font-small);
color:var(--text-muted);
text-overflow:ellipsis;
overflow:hidden;
white-space:nowrap;
}
.slot-clear{
position:absolute;
right:var(--s0);
top:var(--s11);
background:var(--panel-active);
border:var(--s0);
padding:var(--s0);
min-width:var(--target);
color:var(--text-muted);
}
.turnbar{
display:flex;
align-items:center;
gap:var(--s3);
background:var(--panel);
border:var(--hairline) solid var(--line);
border-radius:var(--radius-card);
padding:var(--s3) var(--s4) var(--s3) var(--s7);

}
.estimate{
font-size:var(--font-small);
color:var(--text-soft);
min-width:var(--s0);
flex:1;
display:flex;
flex-direction:column;
gap:var(--s1);
}
.estimate small{
font-size:var(--font-micro);
color:var(--text-muted);
}
.advance{

height:var(--target);

}
.oral-trigger{

padding:var(--s2);
flex:none;
}
.scroll{

min-height:var(--s0);
min-width:var(--s0);
overflow:auto;
background:var(--paper);
color:var(--ink);
border-radius:var(--radius-card) var(--radius-card) var(--s0) var(--s0);

overflow-wrap:anywhere;

}
.chapter-head{
display:flex;

gap:var(--s6);
border-bottom:var(--hairline) solid var(--paper-line);
padding-bottom:var(--s5);
flex-wrap:wrap;
}
.eyebrow{
font:500 var(--font-note) / 1.5 var(--sans);
letter-spacing:var(--tracking);
color:var(--cinnabar-ink);
}
.chapter-head h2{
font-size:var(--font-heading);
color:var(--ink);
flex:1;
}
.chapter-fate{
font-size:var(--font-note);
color:var(--ink-muted);
}
.chapter-date{
font:var(--font-note) / 1.6 var(--sans);
color:var(--ink-muted);
margin-top:var(--s3);
}
.prose{
font:400 var(--font-body) / var(--body-line) var(--serif);
}

color:var(--ink-muted);
margin:var(--s7) var(--s0) var(--s2);
}

white-space:pre-wrap;
}

flex-wrap:wrap;

max-width:100%;
}
.chapter-tabs summary,
.chapter-tabs > button{

padding:var(--s3) var(--s4);
border-radius:var(--radius-tag);

border:var(--s0);
font-size:var(--font-note);
}
.chapter-tabs details[open]{
flex-basis:100%;
}
.chapter-detail{
font-size:var(--font-small);
padding:var(--s5) var(--s0);
}
.chapter-detail ul{
padding-left:var(--s9);
}
.chapter-detail li{
margin-bottom:var(--s2);
}

.paper .muted,
.card .muted,
.province .muted{

}
.scroll .positive,
.scroll .negative,
.card .positive,
.card .negative,
.paper .positive,
.paper .negative{
display:inline-block;
background:var(--desk);
padding:var(--s0) var(--s1);
border-radius:var(--s1);
}
.saved-status{
font-size:var(--font-micro);
color:var(--text-muted);

min-height:var(--s7);
padding-bottom:var(--s2);
}
.sidebar{
border-left:var(--hairline) solid var(--line);

flex-direction:column;
gap:var(--s5);

min-height:var(--s0);
}
.side-title{
display:flex;
align-items:baseline;
justify-content:space-between;
gap:var(--s3);
}
.side-title h2,
.ambitions-block > h2{
font-size:var(--font-document);
color:var(--text-strong);
}
.side-title small{
font-size:var(--font-note);
color:var(--text-muted);
}
.memorial{
display:flex;
gap:var(--s5);
background:var(--paper);
color:var(--ink);
border:var(--s0);
padding:var(--s5) var(--s6);

dialog{

function random(rng) {

x ^= x << 5;

}
function roll(state, low = 1, high = 20) {

state: { ...state, rng: r.rng },
value: low + Math.floor(r.value * (high - low + 1)),
};
}
function fateModifier(die) {
return (die - 10.5) * 4;
}
function fateLabel(die) {
return die <= 3
? "大凶"
: die <= 8
? "不顺"
: die <= 14
? "平常"
: die <= 18
? "顺遂"
: "大吉";
}
function check(
talent,
die,

opposition = 0,
modifier = 0,
) {
const difficulty = { 容易: 40, 一般: 55, 困难: 70, 极难: 85 }[level];
if (!difficulty) throw new Error("未知判定难度");
const score = talent + modifier + fateModifier(die) - opposition / 2;
return { score, difficulty, success: score >= difficulty };

// kept separately so removing an official cannot erase an unrelated event.

return s.court.factions.map(f=>{

const SEASONS=[['春风拂过帘角，庭树新绿。','春雨落在阶前，石色微润。'],['暑气停在檐下，凉扇轻摇。','夏云漫过殿顶，庭荫渐深。'],['秋风吹动帘钩，树叶轻落。','庭中秋色渐浓，阶前微凉。'],['寒风掠过宫墙，炭火轻鸣。','冬日斜照窗棂，炉香缓缓升起。']];
const MODERN_SCENES={
上朝:'大臣们在殿里站好，等候皇帝问话。',批折:'皇帝翻开送来的奏折，拿起朱笔准备批阅。',
下旨:'拟好的旨意摆在桌上，皇帝仔细看过措辞。',后宫:'宫人放轻脚步，内殿里还能闻到茶香。',
外交:'使节送来国书，礼部官员在旁等候。',出巡:'车驾沿着驿路前行，皇帝看着沿途的田地。',
歇息:'皇帝暂时放下手里的事，坐在窗边歇一会儿。',日常:'宫里照常有人来往，送来文书，再安静地退下。',
};
function modernTalkFallback(result){
return result.denied?'这件事超出了臣的职权，需要先回去商议。':result.success?'臣明白陛下的意思，会在自己的职权范围内尽力去办。':'臣有些难处，眼下还办不到。';
}
function sceneNarrative(forecast){
let rng=seedNumber(forecast.turnId||'试读');
const pick=pool=>{const r=random(rng);rng=r.rng;return pool[Math.floor(r.value*pool.length)];};
const month=forecast.state?.era?.month||1,season=Math.min(3,Math.max(0,Math.floor((month-1)/3)));
return Object.fromEntries(['朝','午','夜'].map(slot=>{
const kind=forecast.schedule?.[slot]?.kind||'日常',results=(forecast.slotResults?.[slot]||[]).join(' ');
const execution=(forecast.facts||[]).find(f=>f.kind==='execution'&&f.slot===slot)?.label||results;
const difficult=/封驳|阳奉阴违|敷衍|未允|失败|不足|未成/.test(execution);
const heavy=(forecast.facts||[]).some(f=>['death','war','miscarriage'].includes(f.kind));
if(forecast.state?.settings?.prose==='modern')return [slot,
['春风从窗外吹进来，院里的树长出了新叶。','夏天天气热，宫人轻轻摇着扇子。','秋风吹过院子，树叶慢慢落在台阶旁。','冬日的阳光照进窗里，屋内生着炭火。'][season]+
(MODERN_SCENES[kind]||MODERN_SCENES.日常)+
pick(difficult?['殿里安静了一会儿，皇帝还在考虑接下来该怎么办。','大家暂时没有开口，仍在琢磨刚才谈到的问题。']:heavy?['传来的消息让众人心情沉重，说话时也比平常谨慎。','殿里的气氛有些沉重，众人说话时都放低了声音。']:['话题暂时停了下来，桌边的茶还温着。','皇帝听着窗外的脚步声，想了想刚才谈过的事。'])];
const outcome=difficult?['话语间仍有迟疑，案前的气氛未见舒展。','殿中沉默稍久，御前仍在斟酌。']:heavy?['外间消息压在心头，殿内的话语也沉了下来。','纸上消息牵动心绪，廊下的脚步显得急促。']:['御前话语渐缓，案边又添了茶香。','风穿过帘隙，方才的议论仍在心头。','笔锋稍停，内侍垂手静候。'];
const sensitive=slot==='夜'&&(forecast.facts||[]).some(f=>['pregnancy','birth'].includes(f.kind));
return [slot,pick(SEASONS[season])+pick(SCENES[kind]||SCENES.日常)+(sensitive?'内殿消息引人牵念，帘内的话语放得更轻。':pick(outcome))];
}));
}

return {modernTalkFallback,sceneNarrative};
},

const relief={id:'disaster-relief',title:'请赈灾民',type:'请赈',request:'灾情未解，灾民盼先领口粮，地方请拨银赈济，再清核领用名册。',relief:true};
function routineTemplate(state,group,province,draw){
 const active=new Set(state.memorials.map(m=>m.templateId)),recent=state.memorialVariety||[];
 const disaster=state.nation.provinces.filter(p=>p.disaster>0);
 const unserved=disaster.filter(p=>!state.memorials.some(m=>m.type==='请赈'&&m.provinceId===p.id));
 if(group===2&&unserved.length){const z=unserved[draw%unserved.length];return {...relief,id:relief.id+':'+z.id,provinceId:z.id,title:z.name+' '+relief.title};}
 const shortage=MEMORIAL_TEMPLATES.find(t=>t.id==='grain-shortage');
 if(group===2&&state.nation.grain<0.6&&!active.has(shortage.id))return {...shortage,provinceId:province.id,title:province.name+' '+shortage.title};
 const available=MEMORIAL_TEMPLATES.filter(t=>t.when(state)&&!active.has(t.id));
 if(!available.length)return null;
 let rng=seedNumber(`memorial:${state.rng}:${state.turn}:${group}:${draw}`);
 const pick=pool=>{const r=random(rng);rng=r.rng;return pool[Math.floor(r.value*pool.length)];};
 const least=(pool,key)=>{const ranks=pool.map(x=>recent.findLastIndex(r=>r[key]===x[key]));const min=Math.min(...ranks);return pool.filter((_,i)=>ranks[i]===min);};
 const types=[...new Set(available.map(t=>t.type))].map(type=>({type}));
 const batchTypes=new Set(recent.filter(r=>r.turn===state.turn).map(r=>r.type)),unpicked=types.filter(t=>!batchTypes.has(t.type));
 const type=pick(least(unpicked.length?unpicked:types,'type')).type;
 const t=pick(least(available.filter(t=>t.type===type),'id'));
 const z=province,logistics=group===2&&!t.grain;
 return {...t,...(logistics?{grain:0.6,request:t.request+'，并请拨外差所需口粮'}:{}),provinceId:z.id,title:z.name+' '+t.title};
}
function routineOptions(t,province){
 return [
  {id:'approve',label:t.approve||'准奏',effects:t.relief?{treasury:-8,province:{id:province.id,morale:2,disaster:-5},virtue:1}:{treasury:-2,governance:0.1,...(t.grain?{grain:-t.grain}:{})}},
  {id:'reject',label:t.reject||'驳回',effects:{prestige:0.2,...(t.relief?{virtue:-2}:{})}},
  {id:'hold',label:'留中',effects:{}},
 ];
}

function memorialText(m,modern=false){
 const request=String(m.request||m.title||'有事待议').replace(/[。；]+$/,''),place=m.provinceId&&m.title.includes(' ')?m.title.split(' ')[0]:'';
 const detail=MEMORIAL_DETAILS[m.type]||MEMORIAL_DETAILS.政务,approve=m.options?.[0]?.label==='准奏'?'准照所请办理':m.options?.[0]?.label||'裁处',reject=m.options?.[1]?.label||'暂缓议行';
 return (modern?'陛下，'+(place?place+'报来一事：':''):'臣谨奏：'+(place?place+'来文，':''))+request+'。\n\n'+detail+'\n\n'+
 (modern?'因此，臣请'+approve+'；若陛下另有考虑，也请裁定是否'+reject+'。地方正在等候回音，臣不敢自行更改旧例。':'伏请'+approve+'；若仍'+reject+'，亦请明示应守之例，臣等谨候圣裁。');
}

return {MEMORIAL_TEMPLATES,routineTemplate,routineOptions,memorialText};
},

"src/core/audit.js":function(__load){
function numericSnapshot(s) {
const out = {};
const walk = (value, path) => {
if (typeof value === "number" && Number.isFinite(value)) {
out[path] = value;
} else if (value && typeof value === "object")
for (const [k, v] of Object.entries(value)) {
if (
[
"lifespan",
"aptitude",
"greed",
"secret",
"secretKnown",
"growth",
"born",
"due",
"conceived",
].includes(k)
)
continue;
walk(v, path + "." + k);
}
};
for (const root of ["emperor", "nation"]) walk(s[root], root);
const list = (items, prefix) => {
for (const x of items) {
for (const [k, v] of Object.entries(x)) {
if (
[
"id",
"aptitude",
"greed",
"secret",
"secretKnown",
"born",
"due",
"conceived",
].includes(k)
)
continue;
walk(v, prefix + "." + x.id + "." + k);
}
}
};
// Canonical paths match effect packages. Replace index-based province paths.
for (const k of Object.keys(out))
if (k.startsWith("nation.provinces.")) delete out[k];
list(s.nation.provinces, "province");
list(s.court.factions, "faction");
list(s.court.officials, "official");
list(s.harem.consorts, "consort");
list(s.harem.children, "child");
list(s.foreign, "foreign");
list(s.projects, "project");
list(s.campaigns, "campaign");
return out;
}
function auditChanges(
before,
after,
entries,
source = "本旬引擎结算：人物、政务与岁时变化",
) {
const result = [...entries],
totals = new Map(),
parents = new Set();
for (const e of entries) {
totals.set(e.path, (totals.get(e.path) || 0) + e.after - e.before);
parents.add(e.path.slice(0, e.path.lastIndexOf(".")));
}
const excluded = new Set([
"lifespan",
"aptitude",
"greed",
"secret",
"secretKnown",
"growth",
"born",
"due",
"conceived",
"id",
]);
const visit = (old, current, path) => {
if (old === current) return;
const adjust = parents.has(path);
for (const [key, value] of Object.entries(current || {})) {
if (excluded.has(key)) continue;
if (typeof value === "number" && Number.isFinite(value)) {
const prior = typeof old?.[key] === "number" ? old[key] : 0;
if (value === prior && !adjust) continue;
const full = path + "." + key,
logged = totals.get(full) || 0,
delta = value - prior;
if (Math.abs(delta - logged) > 1e-7)
result.push({
turn: after.turn,
path: full,
before: prior + logged,
after: value,
delta: Math.round((delta - logged) * 10000) / 10000,
source,
});
} else if (value && typeof value === "object")
visit(old?.[key], value, path + "." + key);
}
};
visit(before.emperor, after.emperor, "emperor");
const { provinces, ...nation } = after.nation;
visit(before.nation, nation, "nation");
for (const [old, rows, prefix] of [
[before.nation.provinces, provinces, "province"],
[before.court.factions, after.court.factions, "faction"],
[before.court.officials, after.court.officials, "official"],
[before.harem.consorts, after.harem.consorts, "consort"],
[before.harem.children, after.harem.children, "child"],
[before.foreign, after.foreign, "foreign"],
[before.projects, after.projects, "project"],
[before.campaigns, after.campaigns, "campaign"],
]) {
const prior = new Map(old.map((o) => [o.id, o]));
for (const row of rows)
visit(prior.get(row.id), row, prefix + "." + row.id);
}
return result;
}

return {numericSnapshot,auditChanges};

function scenarioById(id) {
return SCENARIOS.find((x) => x.id === id) || null;
}
// 开局局势预览（开局界面使用）。
function scenarioPreview(sc) {
return {
id: sc.id, title: sc.title, difficulty: sc.difficulty, year: sc.year, blurb: sc.blurb,
emperor: sc.emperor[0], age: sc.emperor[1], era: sc.era, dynasty: sc.dynasty,
cast: sc.officials.slice(0, 6).map((x) => x.split("|")[0]),
};
}
function postTitle(state, post) {
if (!post) return "";
if (post.provinceId && state.governorTitle)
return (state.nation.provinces.find((z) => z.id === post.provinceId)?.name || "") + state.governorTitle;
return state.postNames?.[post.id] || post.title;
}
const split = (x) => x.split("|");

function applyScenario(state, id) {
const sc = scenarioById(id);
if (!sc) throw new Error("未知剧本");
let s = clone(state);
s.scenario = sc.id;
s.dynasty = sc.dynasty;
s.imperialSurname = sc.surname || sc.emperor[0][0];
s.childNaming = sc.childNaming || null;
s.backstory = sc.blurb;
s.era.name = s.reign.eraName = sc.era;
// 官制与州郡
const titles = POSTS[sc.posts].split(" ");
s.postNames = Object.fromEntries(titles.map((t, i) => ["p" + i, t]));
s.governorTitle = sc.governor;
sc.provinces.split(" ").forEach((name, i) => { if (s.nation.provinces[i]) s.nation.provinces[i].name = name; });
const mods = nums(sc.power || "0 0 0 0 0 0");
sc.factions.split(" ").forEach((x, i) => { const [name, demand] = x.split(":"); Object.assign(s.court.factions[i], { name, demand, powerModifier: mods[i] }); });
// 天子
const [name, age, talents, tag] = sc.emperor;
const t = nums(talents);
s.emperor.name = name;
s.emperor.age = age;
s.emperor.lifespan = Math.max(s.emperor.lifespan, age + 25);
s.emperor.talents = Object.fromEntries(Object.keys(s.emperor.talents).map((k, i) => [k, t[i]]));
s.emperor.tags = [tag];
for (const k of ["prestige", "virtue"]) if (sc.nation[k] !== undefined) s.emperor[k] = sc.nation[k];
for (const k of ["treasury", "morale", "governance", "grain"]) if (sc.nation[k] !== undefined) s.nation[k] = sc.nation[k];
s.reign.initialTreasury = s.stats.initialTreasury = s.nation.treasury;
for (const z of s.nation.provinces) z.morale = clamp(s.nation.morale + (z.morale - 62));
s.nation.army.frontiers.forEach((f, i) => { f.threat = sc.threat[i]; });
// 官员：剧本人物按指定职位就任，其余原有官员依次补齐空缺
const cast = sc.officials.map(split), taken = new Set(cast.map((c) => "p" + c[1]));
const free = s.court.posts.filter((p) => !p.provinceId && !taken.has(p.id) && Number(p.id.slice(1)) < 25).map((p) => p.id);
for (const p of s.court.posts) if (!p.provinceId) p.holder = null;
s.court.officials.forEach((o, i) => {
const c = cast[i];
if (c) {
const [n, post, faction, oage, personality, secret, abil, ambition] = c, a = nums(abil);
Object.assign(o, { name: n, post: "p" + post, faction: "f" + faction, age: Number(oage), personality, secret, ambition: Number(ambition),
abilities: { 政: a[0], 军: a[1], 才: a[2], 德: a[3], 忠: a[4], 权谋: a[5] } });
o.life = [personality];
} else {
// 补缺的无名官员不抢剧本人物的戏：野心与权谋压低。
o.post = free.shift() || null;
o.ambition = Math.min(o.ambition, 35);
o.abilities.权谋 = Math.min(o.abilities.权谋, 60);
}
if (o.post) s.court.posts.find((p) => p.id === o.post).holder = o.id;
});
// 后宫与皇嗣
const child = age < 16;
s.harem.consorts = (sc.consorts || []).map(split).map(([n, rank, family, cage, faction, favor, secret], i) => ({
...s.harem.consorts[Math.min(i, s.harem.consorts.length - 1)], id: "c" + i, name: n, rank, family, age: Number(cage),
faction: "f" + faction, favor: Number(favor), secret, preg: null, relations: {},
}));
s.harem.children = (sc.children || []).map(split).map(([n, sex, cage, mother, aptitude], i) => ({
id: "child-" + s.runId + "-s" + i, name: n, sex, mother: mother === "" ? null : "c" + mother, fatherId: s.runId,
legit: s.harem.consorts[Number(mother)]?.rank === "皇后", born: -Number(cage) * 36, aptitude: Number(aptitude), health: 85,
tutor: null, education: Math.min(60, Number(cage) * 4), faction: s.harem.consorts[Number(mother)]?.faction || "f0", party: false,
}));
s.harem.heir = sc.heir !== undefined ? s.harem.children[sc.heir]?.id || null : null;
s.harem.royalWomen = [];
s.dowager = sc.dowager || null;
s.weddingNames = sc.wedding || null;
if (child) {
// 幼帝以皇嗣身份记年龄，亲政时由 advanceRegency 撤摄政、行大婚。
const id = "emperor-" + s.runId;
s.harem.children.push({ id, name, sex: "男", mother: null, fatherId: "prior", legit: true, born: -age * 36,
aptitude: sc.aptitude || 60, health: 85, tutor: null, education: age * 3, faction: "f0", party: false });
s.reign.emperorId = id;
s.reign.married = false;
const regent = sc.regent === "dowager" ? "dowager" : s.court.officials.find((o) => o.name === sc.regent)?.id;
s.regency = { regentId: regent || "dowager", until: (16 - age) * 36 };
} else s.reign.married = s.harem.consorts.length > 0;
// 外邦
s.foreign = sc.foreign.map(split).map(([n, ruler, status, attitude, dir, demand], i) => ({
...s.foreign[Math.min(i, s.foreign.length - 1)], id: "w" + i, name: n, ruler, status, attitude: Number(attitude), frontier: dir, demand, trade: null,
}));
s.court.factions = factionPowers(s);
s.facts = (sc.facts || []).map((x) => { const [subject, key, value] = split(x); return { subject, key, value, turn: 0 }; });
return s;
}

return {SCENARIOS,scenarioById,scenarioPreview,postTitle,applyScenario};
},
"src/store/debounce.js":function(__load){
function createDebouncedSave(run,{schedule=setTimeout,cancel=clearTimeout}={}){
let timer=null;
const clear=()=>{if(timer!==null)cancel(timer);timer=null;};
const flush=()=>{if(timer===null)return Promise.resolve();clear();return run();};
return {schedule(){clear();timer=schedule(()=>{timer=null;run();},800);},flush,cancel:clear};
}

return {createDebouncedSave};
},

const { normalizeMemorialAction, memorialDecision, REMARK_KINDS } = __load("src/core/memorial-decisions.js");
// Request injection keeps orchestration testable without network access. This
// runs before forecast only; a saved pending forecast is never classified again.
async function classifyMemorialSchedule(schedule,request){
const next=structuredClone(schedule);
for(const [slot,action]of Object.entries(next)){
if(!action||!['上朝','批折'].includes(action.kind))continue;
const normalized=normalizeMemorialAction(action);next[slot]=normalized;
for(const id of normalized.memorials||[]){
const d=memorialDecision(normalized,id);if(!d.remark)continue;
try{
const result=await request(d.remark);
if(REMARK_KINDS.includes(result?.kind))normalized.decisions[id]={...d,remarkKind:result.kind};
}catch{/* The engine's negation-aware fallback remains authoritative. */}
}
}
return next;
}

return {classifyMemorialSchedule};
},

"src/ui/common.js":function(__load){
const { initMobileViewport } = __load("src/ui/mobile.js");

function esc(text) {

/[&<>"']/g,
(c) =>
({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
c
],
);
}
// Full re-renders replace the DOM. Keep inner scroll positions (the phone
// layout scrolls inside fixed-height containers) and the focused control.
function nodePath(node, root) {
const path = [];

const parent = node.parentElement;
if (!parent) return null;
path.unshift([...parent.children].indexOf(node));

}
return node === root ? path : null;
}
function nodeAt(root, path) {

for (const i of path) { node = node?.children?.[i]; if (!node) return null; }

}

if (el.id) return { id: el.id };
for (const name of ["scrollKey", "command", "action", "slot", "panel", "clear"])
if (el.dataset?.[name]) return { data: name, value: el.dataset[name] };

}

}
function createDialogRequestScope(dialog, owner) {

begin(){

if(status===429)return '请求过于频繁，请稍后再试。';
if(status>=500)return '服务商暂时不可用，请稍后再试。';
if(/取消/.test(message))return '本次测试已取消，可以重新测试。';
