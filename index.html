.memorial strong {

.memorial-title {

.memorial-status {

.memorial-byline {

.memorial-from {

.memorial-byline > span:last-child {

.memorial.queued {

.memorial.queued .memorial-rail {

.memorial.queued .memorial-status {

}
.memorial-list {

}
.memorial-group + .memorial-group {

.memorial-group > h3 {

color: var(--text-strong);
}
.memorial-group > .muted {

}
.scheduled-memorial p {

}
.decision-summary {

}
.saved-remark {

}
.ambitions-block {

padding-top: var(--s7);

}
.ambition {

margin-top: var(--s5);
}
.ambition small {

}
.bar {

}
.bar i {

height: 100%;

}
.intro {

margin: auto;
text-align: center;
padding: var(--s15) var(--s0);
}
.intro h1 {

font-weight: 900;
color: var(--ink);
margin: var(--s9) var(--s0);
}
.intro .motto {

}
.intro small {

}
.start-actions {
display: flex;
justify-content: center;
gap: var(--s5);
margin: var(--s11) var(--s0);
}
.intro button:not(.primary) {
background: var(--paper-chip);
color: var(--ink);
border-color: var(--paper-line);
}
.rule {

height: var(--hairline);
background: var(--paper-line);

}
.onboarding {
padding: var(--s6);
margin-top: var(--s7);
background: var(--panel-active);
border-radius: var(--radius-card);
font: var(--font-small) / 1.8 var(--sans);
color: var(--text-soft);
}
.intro .onboarding {
background: var(--paper-chip);
color: var(--ink-muted);
}
.warning {
padding: var(--s5);
border: var(--hairline) solid var(--danger-border);
background: var(--panel-active);
color: var(--text-soft);
font-size: var(--font-small);
border-radius: var(--radius-card);
}
.warning button {
margin: var(--s2);
}
.notice {
position: fixed;
left: 50%;
bottom: var(--s11);
transform: translate(-50%, 200%);
opacity: 0;
pointer-events: none;
z-index: 30;
max-width: calc(100% - var(--s13));
background: var(--desk-deep);
color: var(--text);
border: var(--hairline) solid var(--gold);
border-radius: var(--radius-card);
padding: var(--s5) var(--s9);

}
.notice.show {
transform: translate(-50%, 0);
opacity: 1;
}
dialog {
width: min(var(--dialog-width), calc(100% - var(--s13)));
max-width: 100%;
max-height: var(--dialog-height);
margin: auto;
padding: var(--s11) var(--s12);
background: var(--desk-shade);
color: var(--text);
border: var(--hairline) solid var(--line);
border-radius: var(--radius-card);
box-shadow: var(--shadow);
overflow: auto;
overscroll-behavior: contain;
}
dialog::backdrop {
background: var(--desk-shade);
opacity: var(--overlay-opacity);
}
.dialog-head {
display: flex;
align-items: center;
justify-content: space-between;
gap: var(--s7);
position: sticky;

}
.dialog-head h2 {

color: var(--text-strong);
}
#close-modal {

height: var(--target);
padding: var(--s0);
background: var(--clear);
font-size: var(--font-value);

}
.dialog-actions,
.row {
display: flex;
gap: var(--s4);
align-items: center;
flex-wrap: wrap;
}
.dialog-actions {

justify-content: flex-end;
}
.fields,
.grid {

grid-template-columns: repeat(2, minmax(0, 1fr));
gap: var(--s7);
}
.fields > div {

}
.card,
.province,
.paper {
background: var(--paper);
color: var(--ink);
padding: var(--s7);
border-radius: var(--radius-card);
border: var(--hairline) solid var(--paper-line);
min-width: var(--s0);
overflow-wrap: anywhere;
}
.card h3,
.province h3 {

}
.card p,
.province small {

}
.card label {
color: var(--ink-muted);
}
.card button,
.paper button:not(.primary):not(.accountability) {
background: var(--paper-chip);
border-color: var(--paper-line);
color: var(--ink);
}
.card .bar {
background: var(--paper-line);
}
.card dl {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: var(--s2);
font-size: var(--font-small);
}
dt {
color: var(--ink-muted);
}
dd {
margin: var(--s0);
}
.tag {
display: inline-flex;
padding: var(--s1) var(--s4);
border: var(--hairline) solid var(--line-strong);
border-radius: var(--radius-tag);
font-size: var(--font-small);
color: var(--text-soft);
}
.portrait {
width: var(--portrait-size);
height: var(--portrait-size);
display: grid;
place-items: center;

}
.map-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: var(--s5);
}
.province.disaster {
border-color: var(--cinnabar-ink);
}
progress {

}
.section-spacer {
margin-top: var(--s11);
}
.palace {
width: min(var(--palace-width), calc(100% - var(--s13)));
}
.faction-chart {
width: var(--chart-size);
height: var(--chart-size);
border-radius: 50%;

}
.faction-bars {

display: grid;
gap: var(--s5);
}
summary {

min-height: var(--target);
padding: var(--s4) var(--s0);

}
.result {
white-space: pre-wrap;
overflow-wrap: anywhere;
max-height: var(--sidebar-width);
overflow: auto;
padding: var(--s6);
border: var(--hairline) solid var(--line);
font-size: var(--font-small);
}
.talk-line {
background: var(--panel);
padding: var(--s6);
margin-bottom: var(--s5);
border-radius: var(--radius-card);
}
.talk-line.emperor {
color: var(--gold);
}
.streaming {
white-space: pre-wrap;
font: var(--font-body) / var(--body-line) var(--serif);
}
.action-shell {

}
.dual-content {
display: grid;

}
.action-document {
padding: var(--s12);
font-family: var(--serif);
}
.action-document h3 {
font-size: var(--font-heading);
padding-bottom: var(--s7);
border-bottom: var(--hairline) solid var(--paper-line);
}
.action-document p {
font-size: var(--font-body);
line-height: var(--body-line);
}
.action-options {
min-width: var(--s0);
}
.segmented {
display: flex;
gap: var(--s2);
flex-wrap: wrap;
}
.segmented button {
background: var(--clear);
}
.segmented button[aria-pressed="true"] {
border-color: var(--gold);
background: var(--panel-active);
color: var(--gold);
}
dialog.memorial-shell {
width: 100%;
height: var(--app-height);
max-height: var(--app-height);
max-width: 100%;
border: var(--s0);
border-radius: var(--s0);
padding: var(--s11) var(--s9);
display: none;
overflow: hidden;
box-shadow: none;
}
dialog.memorial-shell[open] {
display: flex;
flex-direction: column;
}
.memorial-shell > .dialog-head {
width: 100%;
max-width: var(--review-max);
margin: var(--s0) auto;
position: static;
flex: none;
padding-bottom: var(--s5);
}
.memorial-overlay {
max-width: var(--review-max);
width: 100%;
margin: var(--s0) auto;
min-height: var(--s0);

flex-direction: column;
gap: var(--s7);
flex: 1;
}
.memorial-queue {
display: flex;
align-items: center;
gap: var(--s3);
min-width: var(--s0);
flex: none;
}
.queue-tabs {

gap: var(--s3);
overflow: auto;
flex: 1;
min-width: var(--s0);
}
.queue-tab {

border-color: var(--line);

align-items: center;
gap: var(--s3);
}
.queue-tab[aria-current="step"] {

color: var(--text-strong);
}
.queue-tab .queue-number {
background: var(--line-dashed);
color: var(--desk);
border-radius: 50%;
width: var(--s9);
height: var(--s9);

place-items: center;

}
.queue-tab.done .queue-number,
.queue-tab[aria-current="step"] .queue-number {

}
.queue-picker {

flex: none;
}
.queue-picker > summary {

}
.queue-picker-list {

width: min(var(--review-width), var(--picker-width));

overflow: auto;
background: var(--panel);
padding: var(--s5);
border: var(--hairline) solid var(--gold);
border-radius: var(--radius-card);

gap: var(--s2);
}
.memorial-columns {
display: grid;
grid-template-columns: minmax(0, 1fr) var(--review-width);
gap: var(--s9);
flex: 1;
min-height: var(--s0);
overflow: hidden;
}
.memorial-paper {
padding: var(--s13) var(--s16);
overflow: auto;
display: flex;
flex-direction: column;
gap: var(--s7);
font-family: var(--serif);
border: var(--s0);
}
.memorial-heading {
display: flex;
gap: var(--s5);
align-items: center;
}
.memorial-heading h3 {
font-size: var(--font-heading);
margin: var(--s0);
}
.memorial-meta {
font: var(--font-small) / 1.8 var(--sans);
color: var(--ink-muted);
border-bottom: var(--hairline) solid var(--paper-line);

flex-direction: column;
gap: var(--s2);
}
.memorial-author {
display: flex;
align-items: center;
gap: var(--s3);

}
.memorial-author > span {

min-width: var(--s0);
}
.memorial-author .accountability {

}
.memorial-facts {
display: flex;
gap: var(--s7);
flex-wrap: wrap;
}
.accountability {

padding: var(--s2) var(--s4);
}
.accountability[aria-pressed="true"] {
background: var(--cinnabar);
color: var(--text-strong);
}
.memorial-body {

}
.memorial-foot {
margin-top: auto;
}
.memorial-region {

color: var(--ink-muted);

}
.brush-writing {

}

.brush-control:has(+ .brush-writing:focus-within) .brush-label {

text-underline-offset: var(--s1);
}
.brush-label {
font-family: var(--sans);
color: var(--ink-muted);
}
textarea.brush-input {
outline: none;
font: var(--font-brush) / 1.4 var(--brush);
color: var(--cinnabar-ink);
border: var(--s0);
border-radius: var(--s0);
background: var(--clear);
min-height: var(--slot-height);
transform: rotate(var(--brush-angle));
transform-origin: left center;
padding: var(--s3);
margin: var(--s0);

}
textarea.brush-input::placeholder {

}
.shared-remark-note {
font: var(--font-note) / 1.7 var(--sans);
color: var(--ink-muted);
}
.review-panel {

overflow: auto;
display: flex;
flex-direction: column;
gap: var(--s5);
padding-right: var(--s1);
}
.review-title {
display: flex;
justify-content: space-between;
align-items: baseline;
}
.review-title h3 {
color: var(--text-strong);
margin: var(--s0);
}
.review-title small {
color: var(--text-muted);
}
.review-options {
display: grid;
gap: var(--s4);
}
.review-option {
width: 100%;
text-align: left;
display: flex;
flex-direction: column;
gap: var(--s3);
padding: var(--s6) var(--s7);

}
.review-option[aria-checked="true"] {

}
.option-title {

align-items: baseline;
gap: var(--s3);

}
.option-title small {
font: var(--font-note) / 1.6 var(--sans);

}
.effects {

gap: var(--s2);
flex-wrap: wrap;

}
.effect {

padding: var(--s1) var(--s3);
font-size: var(--font-note);
}
.effect.neutral {
color: var(--text-soft);
}
.debate {
padding: var(--s6);
background: var(--panel);
border: var(--hairline) solid var(--line);
border-radius: var(--radius-card);
}
.debate h4 {
font: 500 var(--font-small) / 1.8 var(--sans);

margin-bottom: var(--s3);
}
.debate-row {
display: grid;
grid-template-columns: var(--s15) minmax(0, 1fr);
gap: var(--s3);

margin-top: var(--s3);
}
.vote {
background: var(--gold);
color: var(--desk);
border-radius: var(--s1);

align-self: start;
font-weight: 700;
}
.vote.yes {
background: var(--up);
}
.vote.no {

}
.debate-row small {

}
.review-footer {
width: var(--review-width);
align-self: flex-end;
display: grid;
grid-template-columns: 1fr 2fr;
gap: var(--s4);

.review-footer button {

}
.review-help {
font-size: var(--font-note);
color: var(--text-muted);
}
.review-error {

}
@media (min-width: 900px) and (max-width: 1099px) {

grid-template-columns: var(--dock-width) minmax(0, 1fr);
}
.sidebar {
display: none;
}
.metrics {

}
.brand {
width: auto;
}
.brand .date {
max-width: var(--chart-size);
}
.metric-reading small,
.metric-meter {

}
.metric-values {
flex-wrap: wrap;
}
.metric-group {
padding: var(--s1);
}
.topbar {
padding: var(--s0) var(--s5);

}
}
@media (max-width: 899px) {
#app {
height: var(--app-height);
}
.topbar {
height: auto;
padding: var(--s6) var(--s7) var(--s5);
gap: var(--s5);
flex-wrap: wrap;
}
.brand {
flex: 1;
width: auto;
gap: var(--s4);
}
.seal {

height: var(--seal-mobile);

}
.brand h1 {
font-size: var(--font-base);
}
.date {
font-size: var(--font-note);
}
.mobile-energy {

}
.energy.compact {

}
.compact .pips {
display: none;
}
.topbar > .metrics,
.top-actions {
display: none;
}
.mobile-menu {
display: grid;
place-items: center;
width: var(--target);
height: var(--target);
background: var(--clear);
padding: var(--s0);
font-size: var(--font-value);
}
.mobile-stats {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: var(--s2);
flex: 0 0 100%;
width: 100%;
padding: var(--s0);
background: var(--clear);
border: var(--s0);
text-align: left;
}
.mobile-stats:hover {

}
.mobile-stats .metric {
background: var(--panel);
border: var(--hairline) solid var(--line);

}
.mobile-stats .metric.danger {

}
.mobile-stats .metric strong {

}
.mobile-stats .metric-meter,
.mobile-stats .metric-reading small {
display: none;
}
.mobile-stats .metric-reading {
gap: var(--s1);
flex-wrap: wrap;
}
.workbench {
display: block;
min-height: var(--s0);
overflow: hidden;
}
.dock,
.sidebar {
display: none;
}
.desk {
height: 100%;
padding: var(--s6) var(--s7) var(--s0);
gap: var(--s4);
}
.planning-title {
display: none;
}
.schedule {
grid-template-columns: 1fr;
gap: var(--s3);
}
.slot {
height: auto;
min-height: var(--slot-mobile);
padding: var(--s3) var(--s5);

grid-template-columns: var(--s13) minmax(0, 1fr);

gap: var(--s0) var(--s5);
}
.slot-meta {

align-self: center;

.slot-meta > span:nth-child(2) {

}
.slot strong {
font-size: var(--font-base);

padding-right: var(--s11);
}
.slot small {

line-height: 1.6;
}
.slot-clear {
top: var(--s2);

}
.turnbar {
display: grid;
grid-template-columns: 1fr;
margin-top: var(--s4);
padding: var(--s0);
border: var(--s0);
background: var(--clear);
gap: var(--s2);
}
.estimate {
font-size: var(--font-note);
line-height: 1.4;
}
.estimate small {

}
.oral-trigger {

}
.advance {

height: var(--primary-height);
}
.scroll {

.chapter-head {

padding-bottom: var(--s4);
}
.chapter-head h2 {

function createDebouncedSave(run,{schedule=setTimeout,cancel=clearTimeout}={}){
let timer=null;
const clear=()=>{if(timer!==null)cancel(timer);timer=null;};
const flush=()=>{if(timer===null)return Promise.resolve();clear();return run();};
return {schedule(){clear();timer=schedule(()=>{timer=null;run();},800);},flush,cancel:clear};
}

return {createDebouncedSave};
},

const { normalizeMemorialAction, memorialDecision, REMARK_KINDS } = __load("src/core/memorial-decisions.js");
// Request injection keeps orchestration testable without network access. This
// runs before forecast only; a saved pending forecast is never classified again.
async function classifyMemorialSchedule(schedule,request){
const next=structuredClone(schedule);
for(const [slot,action]of Object.entries(next)){
if(!action||!['上朝','批折'].includes(action.kind))continue;
const normalized=normalizeMemorialAction(action);next[slot]=normalized;
for(const id of normalized.memorials||[]){
const d=memorialDecision(normalized,id);if(!d.remark)continue;
try{
const result=await request(d.remark);
if(REMARK_KINDS.includes(result?.kind))normalized.decisions[id]={...d,remarkKind:result.kind};
}catch{/* The engine's negation-aware fallback remains authoritative. */}
}
}
return next;
}

return {classifyMemorialSchedule};

"src/core/memorial-decisions.js":function(__load){
const REMARK_KINDS=['嘉奖','申饬','附旨','无'];
function memorialDecision(action,id){
const value=action?.decisions?.[id];
if(value!==undefined&&typeof value!=='string'){
if(!value||typeof value!=='object'||Array.isArray(value)||typeof value.option!=='string'||(value.remark!==undefined&&typeof value.remark!=='string')||(value.remarkKind!==undefined&&!REMARK_KINDS.includes(value.remarkKind)))throw new Error('逐本朱批决定格式无效');
}
const object=value&&typeof value==='object'&&!Array.isArray(value)?value:null;
const option=typeof value==='string'?value:typeof object?.option==='string'?object.option:action?.decision||'approve';
const remark=typeof object?.remark==='string'?object.remark:typeof action?.remark==='string'?action.remark:'';
return {option,remark:remark.slice(0,100),...(REMARK_KINDS.includes(object?.remarkKind)?{remarkKind:object.remarkKind}:{})};
}
function normalizeMemorialAction(action){
if(!action||!['上朝','批折'].includes(action.kind))return action;
return {...action,decisions:Object.fromEntries((action.memorials||[]).map(id=>[id,memorialDecision(action,id)]))};
}
function remarkCategory(text){
// Scope negation to the clause. “责成” is a task assignment, never blame.
const affirmative=String(text).split(/[，,。；;！？!?]/).filter(t=>!/(?:不必|无需|无须|不要|不得|不可|不宜|不应|勿|毋|莫|并非|未予)/.test(t)).join('，');
if(/申饬|斥责|责罚|严查|敷衍|懈怠/.test(affirmative))return '申饬';
if(/嘉奖|有功|可嘉|甚善|勤勉/.test(affirmative))return '嘉奖';
if(/责成|着令|令其|另拟|附旨|交.*核/.test(affirmative))return '附旨';
return '无';
}

return {REMARK_KINDS,memorialDecision,normalizeMemorialAction,remarkCategory};
},

function createAppManifest(href,color) {
const start=new URL('.',href).href;

}
function initAppIcon() {
const color=getComputedStyle(document.documentElement).getPropertyValue('--desk').trim();
const link=(rel,href,sizes)=>{const el=document.createElement('link');el.rel=rel;el.href=href;if(sizes)el.sizes=sizes;document.head.append(el);};
link('icon',APP_ICONS[32],'32x32');
link('apple-touch-icon',APP_ICONS[180],'180x180');
link('manifest',URL.createObjectURL(new Blob([JSON.stringify(createAppManifest(location.href,color))],{type:'application/manifest+json'})));
const theme=document.createElement('meta');theme.name='theme-color';theme.content=color;document.head.append(theme);
}

return {APP_ICONS,createAppManifest,initAppIcon};
},
"src/ui/common.js":function(__load){
const { initMobileViewport } = __load("src/ui/mobile.js");
const $ = (selector) => document.querySelector(selector);
function esc(text) {
return String(text ?? "").replace(
/[&<>"']/g,
(c) =>
({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
c
],
);
}
let toastTimer;
function toast(text) {
$("#notice").textContent = text;
$("#notice").classList.add("show");
const dialog=$("#modal");
if(dialog?.open){
let status=dialog.querySelector('.dialog-notice');
if(!status){
status=document.createElement('p');
status.className='dialog-notice';
status.setAttribute('role','status');
status.setAttribute('aria-live','polite');
const header=dialog.querySelector('.dialog-head');
if(header)header.insertAdjacentElement('afterend',status);
else dialog.prepend(status);
}
status.textContent=text;
}
clearTimeout(toastTimer);
toastTimer = setTimeout(() => $("#notice").classList.remove("show"), 6000);
}
let returnFocus, returnSelector;
function openDialog(title, body, className = "") {
const d = $("#modal");
const active=document.activeElement;
if (d.open) d.close();
if (!active?.closest?.('#modal')) {
returnFocus=active;returnSelector=null;
for (const key of ['command','action','slot','panel']) if(active?.dataset?.[key]) returnSelector='[data-'+key+'="'+CSS.escape(active.dataset[key])+'"]';
}
d.onkeydown=null;
if (className === 'action-shell') body='<div class="dual-content"><article id="action-document" class="paper action-document"><h3>'+esc(title)+'</h3><p>御案上的事，请逐项裁定。</p></article><section class="action-options">'+body+'</section></div>';
d.className = className;
d.innerHTML =
'<div class="dialog-head"><h2 id="modal-title">' +
esc(title) +
'</h2><button type="button" id="close-modal" aria-label="关闭窗口">×</button></div>' +
body;
$("#close-modal").onclick = () => d.close();
d.showModal();
document.documentElement.classList.add("modal-open");
d.scrollTop = 0;
}
function closeDialog() {
$("#modal").close();
}
function download(name, data, type = "application/json") {
const url = URL.createObjectURL(new Blob([data], { type })),
a = document.createElement("a");
a.href = url;
a.download = name;
a.click();
setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function fitBrandText() {
for(const date of document.querySelectorAll('.brand .date,.brand h1')) {
date.style.removeProperty('font-size');
const css=getComputedStyle(date),minimum=Number.parseFloat(css.getPropertyValue(date.matches('h1')?'--font-ui':'--font-minor'))||10;
let size=Number.parseFloat(css.fontSize);
while(date.scrollWidth>date.clientWidth&&size>minimum){size=Math.max(minimum,size-.5);date.style.fontSize=size+'px';}
}
}
function initCommon() {
initMobileViewport();
// Refit after rendering, viewport changes and the optional web fonts settle.
new MutationObserver(fitBrandText).observe($('#app'),{childList:true});
window.addEventListener('resize',fitBrandText);
document.fonts?.ready.then(fitBrandText);
$("#modal").addEventListener("keydown", e => {
if(e.key!=='Tab')return;
const d=$("#modal"),items=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,[tabindex="0"]')].filter(x=>x.tabIndex>=0&&x.getClientRects().length&&(!x.checkVisibility||x.checkVisibility()));
if(!items.length){e.preventDefault();return;}
const at=items.indexOf(document.activeElement);
if((e.shiftKey&&at<=0)||(!e.shiftKey&&(at===items.length-1||at<0))){e.preventDefault();items[e.shiftKey?items.length-1:0].focus();}
});
$("#modal").addEventListener("close", () => {
if($("#modal").open)return;
document.documentElement.classList.remove("modal-open");
if (returnFocus?.isConnected) returnFocus.focus();
else if(returnSelector) document.querySelector(returnSelector)?.focus();
});
}

return {$,esc,toast,openDialog,closeDialog,download,initCommon};
},
"src/ui/mobile.js":function(__load){
// Keep the game at its intended scale while preserving ordinary scrolling and text selection.
function blockPinch(event) {
if ((event.touches?.length || 0) > 1 || ['gesturestart','gesturechange'].includes(event.type)) {
if (event.cancelable) event.preventDefault();
}
}
let installed=false;
function initMobileViewport() {
if(installed)return;

const DRAFT = Symbol("internal-forecast-draft");

function random(rng) {

function roll(state, low = 1, high = 20) {
const r = random(state.rng);

state: { ...state, rng: r.rng },
value: low + Math.floor(r.value * (high - low + 1)),
};
}

? "不顺"
: die <= 14
? "平常"
: die <= 18
? "顺遂"

}

) {

if (!difficulty) throw new Error("未知判定难度");
const score = talent + modifier + fateModifier(die) - opposition / 2;
return { score, difficulty, success: score >= difficulty };
}

},
